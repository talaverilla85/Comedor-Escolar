name: Corregir recortes de la bandeja

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/sanitize_assets.py"
      - ".github/workflows/sanear-imagenes.yml"

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preparar procesador de imágenes
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Generar PNG sin damero y superficies de comida
        run: python scripts/sanitize_assets.py
      - name: Comprobar imágenes generadas
        run: |
          test -s public/assets-clean/bandeja-azul.png
          test -s public/assets-clean/bandeja-roja.png
          test -s public/assets-clean/surface-crema-verde.png
          test -s public/assets-clean/surface-sopa-vegetal.png
      - name: Guardar las imágenes saneadas en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets-clean/
          if ! git diff --cached --quiet; then
            git commit -m "fix(assets): publish cleaned photo textures and tray layers"
            git push
          fi
